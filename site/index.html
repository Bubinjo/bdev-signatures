<!doctype html>
<html lang="sl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B.DEV Signatures</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="runtime.js"></script>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; color: #1f2933; }
      body { margin: 0; background: #f5f7f8; }
      main { max-width: 560px; margin: 0 auto; padding: 24px; }
      .card { background: #fff; border: 1px solid #dfe4e7; border-radius: 12px; padding: 20px; box-shadow: 0 4px 18px rgba(22,34,42,.08); }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { color: #58616b; line-height: 1.5; }
      button { border: 0; border-radius: 7px; background: #2f9c95; color: white; padding: 10px 14px; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      #status { min-height: 20px; margin-top: 12px; font-size: 13px; }
      .note { margin-top: 18px; padding-top: 14px; border-top: 1px solid #e5eaec; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>B.DEV Signatures</h1>
        <p>PoC v0.1 uporablja statične testne podatke. Ob odprtju novega sporočila mora Outlook podpis vstaviti samodejno.</p>
        <button id="apply" type="button">Ročno vstavi testni podpis</button>
        <div id="status" role="status" aria-live="polite"></div>
        <p class="note">V naslednji fazi bo statični profil zamenjan z uporabniškimi atributi iz Microsoft Entra ID prek Microsoft Grapha.</p>
      </section>
    </main>
    <script>
      Office.onReady(function () {
        var button = document.getElementById("apply");
        var status = document.getElementById("status");

        button.addEventListener("click", function () {
          button.disabled = true;
          status.textContent = "Vstavljam podpis …";
          BdevSignature.insertForCurrentItem(function (error) {
            button.disabled = false;
            status.textContent = error ? error.message : "Podpis je bil vstavljen.";
          });
        });
      });
    </script>
  </body>
</html>
